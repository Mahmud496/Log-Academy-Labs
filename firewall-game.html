<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>You Are the Firewall</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{height:100vh;background:#0a0a14;font-family:'Outfit',sans-serif;color:#e0e0e0;display:flex;flex-direction:column;overflow:hidden;user-select:none}
.hud{height:50px;background:#12121e;border-bottom:2px solid #2a2a3e;display:flex;align-items:center;padding:0 20px;gap:20px;flex-shrink:0}
.hud-title{font-size:18px;font-weight:900;color:#ff6b6b}
.hud-stat{font-family:'IBM Plex Mono',monospace;font-size:13px;display:flex;align-items:center;gap:4px}
.hud-stat .v{font-weight:700;font-size:15px}
.s-score .v{color:#4ade80}.s-lives .v{color:#ff6b6b}.s-streak .v{color:#fbbf24}.s-round .v{color:#818cf8}
.hud-r{margin-left:auto;display:flex;gap:12px}
.rules-bar{background:#1a1a2e;border-bottom:1px solid #2a2a3e;padding:8px 20px;display:flex;gap:8px;align-items:center;flex-shrink:0;flex-wrap:wrap;transition:background .3s}
.rules-bar.changed{background:#2a1a3e;animation:ruleFlash .6s}
@keyframes ruleFlash{0%{background:#3a2a5e}100%{background:#1a1a2e}}
.rule-chip{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:4px 12px;border-radius:6px;font-weight:600}
.rule-allow{background:rgba(74,222,128,.1);color:#4ade80;border:1px solid rgba(74,222,128,.2)}
.rule-deny{background:rgba(255,107,107,.1);color:#ff6b6b;border:1px solid rgba(255,107,107,.2)}
.rules-label{font-size:10px;color:#555;font-weight:600;text-transform:uppercase;letter-spacing:1px}
.rules-new{font-size:10px;color:#a855f7;font-weight:700;animation:blink 1s 3}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.game{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.packet{position:absolute;width:360px;background:#1e1e2e;border:2px solid #3a3a5e;border-radius:14px;padding:16px;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.packet.entering{animation:slideIn .4s ease-out}
.packet.allowed{animation:flyRight .4s ease-in forwards;border-color:#4ade80}
.packet.denied{animation:flyLeft .4s ease-in forwards;border-color:#ff6b6b}
.packet.missed{animation:explode .5s ease-out forwards;border-color:#ff6b6b}
@keyframes slideIn{from{transform:translateY(-100px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes flyRight{to{transform:translateX(200%) rotate(10deg);opacity:0}}
@keyframes flyLeft{to{transform:translateX(-200%) rotate(-10deg);opacity:0}}
@keyframes explode{50%{transform:scale(1.2);opacity:.5}to{transform:scale(0);opacity:0}}
.pkt-hdr{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.pkt-proto{font-family:'IBM Plex Mono';font-size:12px;font-weight:700;padding:3px 10px;border-radius:6px}
.proto-tcp{background:rgba(56,189,248,.15);color:#38bdf8}.proto-udp{background:rgba(168,85,247,.15);color:#a855f7}.proto-icmp{background:rgba(251,191,36,.15);color:#fbbf24}
.pkt-dir{font-size:11px;color:#888;flex:1;text-align:right}
.pkt-fields{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.pkt-f{background:#12121e;border-radius:6px;padding:6px 8px}
.pkt-f-label{font-size:8px;color:#555;text-transform:uppercase;letter-spacing:.5px}
.pkt-f-value{font-family:'IBM Plex Mono';font-size:12px;font-weight:600;color:#e0e0e0}
.pkt-f-value.sus{color:#ff6b6b}.pkt-f-value.safe{color:#4ade80}
.pkt-timer{height:4px;background:#2a2a3e;border-radius:2px;margin-bottom:12px;overflow:hidden}
.pkt-timer-fill{height:100%;background:linear-gradient(90deg,#4ade80,#fbbf24,#ff6b6b);border-radius:2px;transition:width .1s linear}
.pkt-btns{display:flex;gap:8px}
.pkt-btn{flex:1;padding:12px;border-radius:10px;border:none;cursor:pointer;font-size:16px;font-weight:800;font-family:'Outfit';transition:all .1s}
.pkt-btn:hover{transform:translateY(-2px)}.pkt-btn:active{transform:translateY(1px)}
.btn-allow{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff}
.btn-deny{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff}
.flash{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;opacity:0;transition:opacity .15s}
.flash.green{background:rgba(34,197,94,.15);opacity:1}.flash.red{background:rgba(239,68,68,.15);opacity:1}
.screen{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px}
.screen h1{font-size:42px;font-weight:900;color:#ff6b6b}
.screen p{font-size:14px;color:#888;max-width:450px;line-height:1.7}
.screen .big-btn{padding:14px 40px;border-radius:99px;border:2px solid #ff6b6b;background:transparent;color:#ff6b6b;font-size:18px;font-weight:800;cursor:pointer;font-family:'Outfit'}
.screen .big-btn:hover{background:rgba(255,107,107,.1)}
.end-stats{display:flex;gap:16px}
.es{background:#1e1e2e;border:1px solid #3a3a5e;border-radius:12px;padding:16px 24px;text-align:center}
.es-v{font-family:'IBM Plex Mono';font-size:28px;font-weight:700}.es-k{font-size:10px;color:#888;margin-top:2px}
.key-hint{display:flex;gap:16px;margin-top:8px}
.key-hint div{font-size:11px;color:#555;display:flex;align-items:center;gap:4px}
.key-hint kbd{background:#2a2a3e;padding:2px 8px;border-radius:4px;font-family:'IBM Plex Mono';font-size:11px;border:1px solid #3a3a5e;color:#e0e0e0}
</style>
</head>
<body>
<div class="hud">
<span class="hud-title">YOU ARE THE FIREWALL</span>
<div class="hud-stat s-score">Score: <span class="v" id="h-score">0</span></div>
<div class="hud-stat s-lives">Lives: <span class="v" id="h-lives">❤❤❤❤❤</span></div>
<div class="hud-stat s-streak">Streak: <span class="v" id="h-streak">0</span></div>
<div class="hud-stat s-round">Round: <span class="v" id="h-round">1</span></div>
</div>
<div class="rules-bar" id="rules-bar"></div>
<div class="flash" id="flash"></div>
<div class="game" id="game"></div>

<script>
// 12 different rule sets — game randomly picks one every 5 packets
const RULESETS=[
{name:'Web Server',rules:[
  {act:'ALLOW',desc:'TCP to port 80 (HTTP)',match:(p)=>p.proto==='TCP'&&p.dstPort===80},
  {act:'ALLOW',desc:'TCP to port 443 (HTTPS)',match:(p)=>p.proto==='TCP'&&p.dstPort===443},
],default:'DENY'},
{name:'SSH + Web',rules:[
  {act:'ALLOW',desc:'TCP to port 22 (SSH)',match:(p)=>p.proto==='TCP'&&p.dstPort===22},
  {act:'ALLOW',desc:'TCP to port 443 (HTTPS)',match:(p)=>p.proto==='TCP'&&p.dstPort===443},
],default:'DENY'},
{name:'Mail Server',rules:[
  {act:'ALLOW',desc:'TCP to port 25 (SMTP)',match:(p)=>p.proto==='TCP'&&p.dstPort===25},
  {act:'ALLOW',desc:'TCP to port 993 (IMAPS)',match:(p)=>p.proto==='TCP'&&p.dstPort===993},
  {act:'ALLOW',desc:'TCP to port 443 (Webmail)',match:(p)=>p.proto==='TCP'&&p.dstPort===443},
],default:'DENY'},
{name:'DNS Only',rules:[
  {act:'ALLOW',desc:'UDP to port 53 (DNS)',match:(p)=>p.proto==='UDP'&&p.dstPort===53},
  {act:'ALLOW',desc:'TCP to port 53 (DNS zone transfer)',match:(p)=>p.proto==='TCP'&&p.dstPort===53},
],default:'DENY'},
{name:'Block Attacker',rules:[
  {act:'DENY',desc:'ALL from 91.134.188.45',match:(p)=>p.src==='91.134.188.45'},
  {act:'ALLOW',desc:'TCP to port 80 and 443',match:(p)=>p.proto==='TCP'&&(p.dstPort===80||p.dstPort===443)},
],default:'DENY'},
{name:'Internal Only',rules:[
  {act:'ALLOW',desc:'TCP to port 445 (SMB file sharing)',match:(p)=>p.proto==='TCP'&&p.dstPort===445},
  {act:'ALLOW',desc:'TCP to port 3389 (RDP)',match:(p)=>p.proto==='TCP'&&p.dstPort===3389},
],default:'DENY'},
{name:'Database Server',rules:[
  {act:'ALLOW',desc:'TCP to port 3306 (MySQL) from 10.10.1.30 ONLY',match:(p)=>p.proto==='TCP'&&p.dstPort===3306&&p.src==='10.10.1.30'},
  {act:'DENY',desc:'TCP to port 3306 from anyone else',match:(p)=>p.proto==='TCP'&&p.dstPort===3306},
  {act:'ALLOW',desc:'TCP to port 22 (SSH)',match:(p)=>p.proto==='TCP'&&p.dstPort===22},
],default:'DENY'},
{name:'Outbound Filter',rules:[
  {act:'DENY',desc:'TCP to port 4444 (Metasploit)',match:(p)=>p.dstPort===4444},
  {act:'DENY',desc:'TCP to port 8080 (C2 proxy)',match:(p)=>p.dstPort===8080},
  {act:'DENY',desc:'TCP to port 9001 (Tor)',match:(p)=>p.dstPort===9001},
  {act:'ALLOW',desc:'TCP to port 80 and 443',match:(p)=>p.proto==='TCP'&&(p.dstPort===80||p.dstPort===443)},
],default:'DENY'},
{name:'Restricted SSH',rules:[
  {act:'ALLOW',desc:'TCP port 22 from 10.0.0.1 ONLY',match:(p)=>p.proto==='TCP'&&p.dstPort===22&&p.src==='10.0.0.1'},
  {act:'DENY',desc:'TCP port 22 from anyone else',match:(p)=>p.proto==='TCP'&&p.dstPort===22},
  {act:'ALLOW',desc:'TCP port 443',match:(p)=>p.proto==='TCP'&&p.dstPort===443},
],default:'DENY'},
{name:'Allow ICMP Only',rules:[
  {act:'ALLOW',desc:'ICMP (ping) from any source',match:(p)=>p.proto==='ICMP'},
  {act:'ALLOW',desc:'UDP to port 53 (DNS)',match:(p)=>p.proto==='UDP'&&p.dstPort===53},
],default:'DENY'},
{name:'Block Two Attackers',rules:[
  {act:'DENY',desc:'ALL from 91.134.188.45',match:(p)=>p.src==='91.134.188.45'},
  {act:'DENY',desc:'ALL from 185.220.101.47',match:(p)=>p.src==='185.220.101.47'},
  {act:'ALLOW',desc:'TCP port 80, 443, 22',match:(p)=>p.proto==='TCP'&&[80,443,22].includes(p.dstPort)},
],default:'DENY'},
{name:'Full Lockdown',rules:[
  {act:'ALLOW',desc:'TCP port 443 from 10.0.0.0/8 only',match:(p)=>p.proto==='TCP'&&p.dstPort===443&&p.src.startsWith('10.')},
  {act:'DENY',desc:'Everything else',match:()=>true},
],default:'DENY'},
];

const SRCS=['10.0.0.50','10.0.0.51','192.168.1.20','10.0.0.1','10.10.1.30','91.134.188.45','185.220.101.47','203.0.113.42','172.16.5.10','8.8.8.8'];
const PORTS=[21,22,25,53,80,110,443,445,993,3306,3389,4444,8080,9001,8443];
const PORTNAMES={21:'FTP',22:'SSH',25:'SMTP',53:'DNS',80:'HTTP',110:'POP3',443:'HTTPS',445:'SMB',993:'IMAPS',3306:'MySQL',3389:'RDP',4444:'Meterpreter',8080:'Proxy',9001:'Tor',8443:'HTTPS-alt'};

let state='start',score=0,lives=5,streak=0,bestStreak=0,roundNum=0,currentRuleset=null,pktTimer=null,timerStart=0,totalPkts=0,correctPkts=0,timePerPkt=8000;

function pickRuleset(){
  let rs;
  do{rs=RULESETS[Math.floor(Math.random()*RULESETS.length)];}while(rs===currentRuleset);
  currentRuleset=rs;roundNum++;
  renderRules();
  document.getElementById('h-round').textContent=roundNum;
}

function renderRules(){
  document.getElementById('rules-bar').innerHTML=`<span class="rules-label">Active Rules:</span>`+
    currentRuleset.rules.map(r=>`<span class="rule-chip rule-${r.act.toLowerCase()}">${r.act}: ${r.desc}</span>`).join('')+
    `<span class="rule-chip rule-${currentRuleset.default.toLowerCase()}">DEFAULT: ${currentRuleset.default} all else</span>`;
}

function genPacket(){
  const portIdx=Math.floor(Math.random()*PORTS.length);
  const srcIdx=Math.floor(Math.random()*SRCS.length);
  const port=PORTS[portIdx];
  const protos=['TCP','TCP','TCP','TCP','UDP','UDP','ICMP'];
  let proto=port===53?(Math.random()>.5?'UDP':'TCP'):port===0?'ICMP':'TCP';
  if(Math.random()<.1)proto='ICMP';
  if(Math.random()<.15)proto='UDP';
  const src=SRCS[srcIdx];

  const pkt={proto,src,dst:'192.168.1.100',srcPort:Math.floor(Math.random()*16383)+49152,dstPort:proto==='ICMP'?0:port,portName:proto==='ICMP'?'Echo':PORTNAMES[port]||'Unknown'};

  // Determine correct action
  let correct=currentRuleset.default;
  for(const rule of currentRuleset.rules){
    if(rule.match(pkt)){correct=rule.act;break;}
  }
  pkt.correct=correct.toLowerCase();
  pkt.suspicious=src==='91.134.188.45'||src==='185.220.101.47'||[4444,8080,9001].includes(port);
  return pkt;
}

function updateHUD(){
  document.getElementById('h-score').textContent=score;
  document.getElementById('h-lives').textContent='❤'.repeat(Math.max(0,lives))+'🖤'.repeat(Math.max(0,5-lives));
  document.getElementById('h-streak').textContent=streak;
}

function flash(c){const f=document.getElementById('flash');f.className='flash '+c;setTimeout(()=>f.className='flash',200);}

function startGame(){
  state='playing';score=0;lives=5;streak=0;bestStreak=0;roundNum=0;totalPkts=0;correctPkts=0;timePerPkt=8000;
  pickRuleset();updateHUD();nextPacket();
}

function nextPacket(){
  if(lives<=0){endGame();return;}
  // Change rules every 5 packets
  pickRuleset();
  // Gradually speed up
  if(totalPkts>10)timePerPkt=7000;
  if(totalPkts>20)timePerPkt=6000;
  if(totalPkts>35)timePerPkt=5000;

  const pkt=genPacket();
  const g=document.getElementById('game');
  g.innerHTML=`<div class="packet entering" id="pkt">
    <div class="pkt-hdr"><span class="pkt-proto proto-${pkt.proto.toLowerCase()}">${pkt.proto}</span><span class="pkt-dir">${pkt.src} → ${pkt.dst}</span></div>
    <div class="pkt-fields">
      <div class="pkt-f"><div class="pkt-f-label">Source IP</div><div class="pkt-f-value ${pkt.suspicious?'sus':''}">${pkt.src}</div></div>
      <div class="pkt-f"><div class="pkt-f-label">Dest IP</div><div class="pkt-f-value">${pkt.dst}</div></div>
      <div class="pkt-f"><div class="pkt-f-label">Protocol</div><div class="pkt-f-value">${pkt.proto}</div></div>
      <div class="pkt-f"><div class="pkt-f-label">Dest Port</div><div class="pkt-f-value ${pkt.suspicious?'sus':'safe'}">${pkt.proto==='ICMP'?'N/A':pkt.dstPort+' ('+pkt.portName+')'}</div></div>
    </div>
    <div class="pkt-timer"><div class="pkt-timer-fill" id="timer-fill" style="width:100%"></div></div>
    <div class="pkt-btns">
      <button class="pkt-btn btn-allow" onclick="decide('allow')">✓ ALLOW</button>
      <button class="pkt-btn btn-deny" onclick="decide('deny')">✗ DENY</button>
    </div>
  </div>`;

  window._pkt=pkt;
  timerStart=Date.now();
  clearInterval(pktTimer);
  pktTimer=setInterval(()=>{
    const elapsed=Date.now()-timerStart;
    const pct=Math.max(0,100-elapsed/timePerPkt*100);
    const fill=document.getElementById('timer-fill');
    if(fill){fill.style.width=pct+'%';if(pct<33)fill.style.background='linear-gradient(90deg,#ff6b6b,#ff6b6b)';}
    if(elapsed>=timePerPkt){clearInterval(pktTimer);timeout();}
  },50);
}

function decide(action){
  clearInterval(pktTimer);totalPkts++;
  const pkt=window._pkt;const correct=action===pkt.correct;
  const el=document.getElementById('pkt');
  if(correct){score+=100+(streak*20);streak++;correctPkts++;if(streak>bestStreak)bestStreak=streak;el.className='packet '+(action==='allow'?'allowed':'denied');flash('green');}
  else{lives--;streak=0;el.className='packet missed';flash('red');}
  updateHUD();setTimeout(nextPacket,500);
}

function timeout(){lives--;streak=0;totalPkts++;document.getElementById('pkt').className='packet missed';flash('red');updateHUD();setTimeout(nextPacket,600);}

function endGame(){
  state='end';clearInterval(pktTimer);
  const pct=totalPkts?Math.round(correctPkts/totalPkts*100):0;
  document.getElementById('game').innerHTML=`<div class="screen">
    <h1>FIREWALL DOWN</h1>
    <div class="end-stats">
      <div class="es"><div class="es-v" style="color:#4ade80">${score}</div><div class="es-k">Score</div></div>
      <div class="es"><div class="es-v" style="color:#fbbf24">${bestStreak}</div><div class="es-k">Best Streak</div></div>
      <div class="es"><div class="es-v" style="color:#38bdf8">${pct}%</div><div class="es-k">Accuracy</div></div>
      <div class="es"><div class="es-v" style="color:#a855f7">${totalPkts}</div><div class="es-k">Packets</div></div>
      <div class="es"><div class="es-v" style="color:#818cf8">${roundNum}</div><div class="es-k">Rounds</div></div>
    </div>
    <button class="big-btn" onclick="startGame()">Try again →</button>
  </div>`;
}

document.addEventListener('keydown',e=>{
  if(state!=='playing')return;
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')decide('deny');
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')decide('allow');
});

document.getElementById('game').innerHTML=`<div class="screen">
<h1>YOU ARE THE FIREWALL</h1>
<p>Packets incoming. ALLOW or DENY based on the rules at the top. <strong>Rules change with EVERY packet!</strong> You must read the rules each time. You have 5 lives.</p>
<div class="key-hint"><div><kbd>→</kbd> or <kbd>D</kbd> = ALLOW</div><div><kbd>←</kbd> or <kbd>A</kbd> = DENY</div></div>
<button class="big-btn" onclick="startGame()">Start shift →</button>
</div>`;
updateHUD();
</script>
</body></html>
